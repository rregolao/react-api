services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: reactgram
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reactgram"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:dev123@db:5432/reactgram?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node src/app.js"

volumes:
  pgdata: